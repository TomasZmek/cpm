version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/", "/sdk", "/modules/dockhand"]
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/"]
    target-branch: develop
    schedule:
      interval: weekly
