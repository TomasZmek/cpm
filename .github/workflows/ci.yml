# Checks for every pull request and push to develop / main:
# formatting, go vet, tests (with the race detector) and known
# vulnerabilities in the main module and the separate modules (sdk/,
# modules/*), plus a Docker build without push.
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [".", "sdk", "modules/dockhand"]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Latest patch release, as in the Dockerfile
          go-version: "1.26.x"
          cache-dependency-path: ${{ matrix.dir }}/go.mod

      - name: gofmt
        run: |
          # The root module must not report files of the separate modules twice
          files=$(gofmt -s -l $(find . -name '*.go' -not -path './sdk/*' -not -path './modules/*'))
          if [ -n "$files" ]; then
            echo "Not gofmt -s formatted:"; echo "$files"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          tags: cpm:ci
