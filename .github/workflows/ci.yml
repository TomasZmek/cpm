# Checks for every pull request and push to develop / main:
# formatting, go vet, tests (with the race detector) and known
# vulnerabilities in the main module and the separate modules (sdk/,
# modules/*), plus a Docker build without push.
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [".", "sdk", "modules/dockhand"]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          # Latest patch release, as in the Dockerfile
          go-version: "1.26.x"
          cache-dependency-path: ${{ matrix.dir }}/go.mod

      - name: gofmt
        run: |
          # The root module must not report files of the separate modules twice
          files=$(gofmt -s -l $(find . -name '*.go' -not -path './sdk/*' -not -path './modules/*'))
          if [ -n "$files" ]; then
            echo "Not gofmt -s formatted:"; echo "$files"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: cpm:ci
