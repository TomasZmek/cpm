# Builds a release: multi-arch image on GitHub Container Registry plus a
# GitHub release (with tag) carrying offline image packages for amd64/arm64.
#
# Run it from GitHub → Actions → Release → Run workflow on main (version
# without "v"), or push a tag v<version>. cmd/cpm/main.go must already have
# that version (see "Release process" in CLAUDE.md).
#
# Docker Hub (optional): with the repository secrets DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN (access token, Read & Write; Read, Write & Delete to also
# update the description) the image is pushed to perteus/caddy-ui as well
# (override with the repository variable DOCKERHUB_IMAGE) and the Docker Hub
# description is updated from DOCKERHUB.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v, e.g. 3.4.1 (must match cmd/cpm/main.go)"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the release and its tag
  packages: write   # push to ghcr.io

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' && secrets.DOCKERHUB_USERNAME != '' }}
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'perteus/caddy-ui' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          V="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Invalid version '$V'"; exit 1
          fi
          if ! grep -Eq "Version[[:space:]]+= \"$V\"" cmd/cpm/main.go; then
            echo "::error::cmd/cpm/main.go does not contain Version = \"$V\""; exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        if: env.HAS_DOCKERHUB == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        id: tags
        run: |
          {
            echo "list<<EOF"
            echo "$IMAGE:$VERSION"
            echo "$IMAGE:latest"
            if [ "$HAS_DOCKERHUB" = "true" ]; then
              echo "$DOCKERHUB_IMAGE:$VERSION"
              echo "$DOCKERHUB_IMAGE:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ "$HAS_DOCKERHUB" != "true" ]; then
            echo "::notice::Docker Hub secrets not set, pushing to ghcr.io only"
          fi

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.title=CPM - Caddy Proxy Manager

      - name: Export offline packages
        # One docker-archive per platform, written by buildx (layers come from
        # the cache of the previous step). `docker save` of a single platform
        # of a multi-arch image fails with the containerd image store.
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" \
              --output "type=docker,dest=dist/cpm-$VERSION-$arch.tar,name=perteus/caddy-ui:$VERSION" .
          done
          (cd dist && sha256sum *.tar > SHA256SUMS)
          ls -la dist

      - name: Release notes
        run: |
          # Section of RELEASE_NOTES.md from "# CPM v<version>" up to the next "---".
          awk -v v="# CPM v$VERSION" '
            index($0, v) == 1 { on = 1; title = $0; next }
            on && /^---/ { exit }
            on { print }
            END { if (!on) exit 1 }
          ' RELEASE_NOTES.md > notes.md || { echo "::error::No section for v$VERSION in RELEASE_NOTES.md"; exit 1; }
          title=$(grep -m1 "^# CPM v$VERSION" RELEASE_NOTES.md | sed 's/^# //')
          echo "TITLE=$title" >> "$GITHUB_ENV"
          cat >> notes.md <<NOTES

          ## 📦 Install

          - **Docker Hub:** \`perteus/caddy-ui:$VERSION\`
          - **GitHub Container Registry (multi-arch):** \`$IMAGE:$VERSION\`
          - **Offline:** download \`cpm-$VERSION-amd64.tar\` (Intel/AMD) or \`cpm-$VERSION-arm64.tar\` (ARM64) below and run \`docker load -i <file>\`; the image is tagged \`perteus/caddy-ui:$VERSION\`. Check with \`sha256sum -c SHA256SUMS\`.
          NOTES

      - name: Update Docker Hub description
        if: env.HAS_DOCKERHUB == 'true'
        continue-on-error: true   # needs a token with Read, Write & Delete scope
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          readme-filepath: ./DOCKERHUB.md
          short-description: "Lightweight web UI for managing a Caddy reverse proxy (~6 MB, amd64/arm64)"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$TITLE" --notes-file notes.md
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "$TITLE" --notes-file notes.md
          fi
