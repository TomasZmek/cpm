# Test builds of the develop branch, never tagged "latest":
#   Docker Hub: perteus/caddy-ui:develop, :<next>-dev and :develop-<short sha>
#   ghcr.io:    ghcr.io/tomaszmek/cpm:develop, :<next>-dev and :develop-<short sha>
#   GitHub:     pre-release "v<next>-dev" (rebuilt on every run) with offline
#               packages for amd64 and arm64
# <next> is the version being prepared: from the "# CPM v<next> - Unreleased"
# heading of RELEASE_NOTES.md, else the patch release after the current one.
# The tag is never just "develop": a tag named like the branch makes
# "git push origin develop" ambiguous.
# Runs on every push to develop and can be started manually.
name: Develop build

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write   # pre-release and its tag
  packages: write   # ghcr.io

concurrency:
  group: develop-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' && secrets.DOCKERHUB_USERNAME != '' }}
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'perteus/caddy-ui' }}
    steps:
      - uses: actions/checkout@v4

      - name: Names
        run: |
          echo "SHORT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          APP_VERSION=$(sed -n 's/^[[:space:]]*Version[[:space:]]*= "\(.*\)"/\1/p' cmd/cpm/main.go)
          NEXT=$(sed -n 's/^# CPM v\([0-9][0-9.]*\) - Unreleased.*/\1/p' RELEASE_NOTES.md | head -n1)
          if [ -z "$NEXT" ]; then
            NEXT=$(echo "$APP_VERSION" | awk -F. '{ printf "%d.%d.%d", $1, $2, $3 + 1 }')
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "NEXT_VERSION=$NEXT" >> "$GITHUB_ENV"
          echo "DEV_TAG=v$NEXT-dev" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        if: env.HAS_DOCKERHUB == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        id: tags
        run: |
          {
            echo "list<<EOF"
            echo "$IMAGE:develop"
            echo "$IMAGE:$NEXT_VERSION-dev"
            echo "$IMAGE:develop-$SHORT"
            if [ "$HAS_DOCKERHUB" = "true" ]; then
              echo "$DOCKERHUB_IMAGE:develop"
              echo "$DOCKERHUB_IMAGE:$NEXT_VERSION-dev"
              echo "$DOCKERHUB_IMAGE:develop-$SHORT"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.NEXT_VERSION }}-dev+${{ env.SHORT }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=CPM - Caddy Proxy Manager (develop)

      - name: Export offline packages
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" \
              --output "type=docker,dest=dist/cpm-develop-$SHORT-$arch.tar,name=perteus/caddy-ui:develop-$SHORT" .
          done
          (cd dist && sha256sum *.tar > SHA256SUMS)

      - name: Release notes
        run: |
          awk '/^# CPM (v[0-9.]+ )?- Unreleased/ { on = 1; next } on && /^---/ { exit } on { print }' RELEASE_NOTES.md > unreleased.md
          cat > notes.md <<NOTES
          ⚠️ **Test build of v$NEXT_VERSION from the \`develop\` branch** (commit [\`$SHORT\`](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA), based on v$APP_VERSION). Not a release — may change or break; replaced by every push to develop.

          - **Docker Hub:** \`$DOCKERHUB_IMAGE:develop\` or \`$DOCKERHUB_IMAGE:$NEXT_VERSION-dev\` (always the newest) or \`$DOCKERHUB_IMAGE:develop-$SHORT\` (this build)
          - **GitHub Container Registry:** \`$IMAGE:develop\` / \`$IMAGE:$NEXT_VERSION-dev\` / \`$IMAGE:develop-$SHORT\`
          - **Offline:** \`cpm-develop-$SHORT-amd64.tar\` / \`-arm64.tar\` below, \`docker load -i <file>\` (tagged \`perteus/caddy-ui:develop-$SHORT\`)

          ## Changes since v$APP_VERSION
          NOTES
          cat unreleased.md >> notes.md

      - name: Replace the develop pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Remove earlier test builds: this version's, older "-dev" ones and
          # the former "develop" tag (it clashed with the branch name).
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' |
            { grep -E '^(develop|v[0-9.]+-dev)$' || true; } |
            while read -r tag; do
              gh release delete "$tag" --cleanup-tag --yes >/dev/null 2>&1 || true
            done
          for tag in develop "$DEV_TAG"; do
            git push origin ":refs/tags/$tag" >/dev/null 2>&1 || true
          done
          gh release create "$DEV_TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "v$NEXT_VERSION-dev (develop build $SHORT)" \
            --notes-file notes.md \
            --prerelease --latest=false
