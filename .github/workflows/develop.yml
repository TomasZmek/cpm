# Test builds of the develop branch, never tagged "latest":
#   Docker Hub: perteus/caddy-ui:develop and :develop-<short sha>
#   ghcr.io:    ghcr.io/tomaszmek/cpm:develop and :develop-<short sha>
#   GitHub:     pre-release "develop" (rebuilt on every run) with offline
#               packages for amd64 and arm64
# Runs on every push to develop and can be started manually.
name: Develop build

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write   # pre-release and its tag
  packages: write   # ghcr.io

concurrency:
  group: develop-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' && secrets.DOCKERHUB_USERNAME != '' }}
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'perteus/caddy-ui' }}
    steps:
      - uses: actions/checkout@v4

      - name: Names
        run: |
          echo "SHORT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "APP_VERSION=$(sed -n 's/^[[:space:]]*Version[[:space:]]*= "\(.*\)"/\1/p' cmd/cpm/main.go)" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        if: env.HAS_DOCKERHUB == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        id: tags
        run: |
          {
            echo "list<<EOF"
            echo "$IMAGE:develop"
            echo "$IMAGE:develop-$SHORT"
            if [ "$HAS_DOCKERHUB" = "true" ]; then
              echo "$DOCKERHUB_IMAGE:develop"
              echo "$DOCKERHUB_IMAGE:develop-$SHORT"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=develop-${{ env.SHORT }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=CPM - Caddy Proxy Manager (develop)

      - name: Export offline packages
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" \
              --output "type=docker,dest=dist/cpm-develop-$SHORT-$arch.tar,name=perteus/caddy-ui:develop-$SHORT" .
          done
          (cd dist && sha256sum *.tar > SHA256SUMS)

      - name: Release notes
        run: |
          awk 'index($0, "# CPM - Unreleased") == 1 { on = 1; next } on && /^---/ { exit } on { print }' RELEASE_NOTES.md > unreleased.md
          cat > notes.md <<NOTES
          ⚠️ **Test build of the \`develop\` branch** (commit [\`$SHORT\`](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA), based on v$APP_VERSION). Not a release — may change or break; replaced by every push to develop.

          - **Docker Hub:** \`$DOCKERHUB_IMAGE:develop\` (always the newest) or \`$DOCKERHUB_IMAGE:develop-$SHORT\` (this build)
          - **GitHub Container Registry:** \`$IMAGE:develop\` / \`$IMAGE:develop-$SHORT\`
          - **Offline:** \`cpm-develop-$SHORT-amd64.tar\` / \`-arm64.tar\` below, \`docker load -i <file>\` (tagged \`perteus/caddy-ui:develop-$SHORT\`)

          ## Changes since v$APP_VERSION
          NOTES
          cat unreleased.md >> notes.md

      - name: Replace the develop pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete develop --cleanup-tag --yes >/dev/null 2>&1 || true
          git push origin ":refs/tags/develop" >/dev/null 2>&1 || true
          gh release create develop dist/* \
            --target "$GITHUB_SHA" \
            --title "Develop build $SHORT (test)" \
            --notes-file notes.md \
            --prerelease --latest=false
