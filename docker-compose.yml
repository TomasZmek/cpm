services:
  caddy:
    # Caddy with the Cloudflare DNS module (needed for wildcard certificates
    # and the cloudflare_dns snippet). Alternatively build it yourself:
    #   build:
    #     context: .
    #     dockerfile: Dockerfile.caddy
    image: serfriz/caddy-cloudflare:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443/tcp"
      - "443:443/udp"
    environment:
      # Required when "Use CF_API_TOKEN environment variable" is enabled in CPM
      - CF_API_TOKEN=${CF_API_TOKEN}
    volumes:
      - ./caddy-config/Caddyfile:/etc/caddy/Caddyfile
      - ./caddy-config/snippets.caddy:/etc/caddy/snippets.caddy
      - ./caddy-config/sites:/etc/caddy/sites
      - ./caddy-data:/data
      - ./caddy-config/pages:/usr/share/caddy/pages

  cpm:
    image: perteus/caddy-ui:latest
    # Or build locally:
    # build: .
    container_name: cpm
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - CONTAINER_NAME=caddy
      - CADDY_CONFIG_PATH=/caddy-config
      - CADDY_DATA_PATH=/caddy-data
    volumes:
      - ./caddy-config:/caddy-config
      - ./caddy-data:/caddy-data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - caddy
